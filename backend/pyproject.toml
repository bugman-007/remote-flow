[project]
name = "remote-flow-backend"
version = "0.1.0"
description = "Remote Flow backend: FastAPI API, Celery workers and the vendored document generator."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0"]

[tool.setuptools]
packages = ["app", "app.routers", "app.services", "app.workers", "vendor", "vendor.resume_builder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# Remote Flow — single-node production stack (OPS-1, §3.2, HW-1/HW-2).
#
#   cp deploy/.env.example deploy/.env   # then edit MASTER_KEY / PUBLIC_URL
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
#
# CPU priorities (HW-1) and memory limits (HW-2) are deliberate: interactive paths
# (api, postgres) win over the render worker, which is the memory-hungry one.
name: remote-flow

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://remote_flow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/remote_flow
  REDIS_URL: redis://redis:6379/0
  MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY (base64 of 32 random bytes)}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  STORAGE_DIR: /storage
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  ENVIRONMENT: production
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # CONC-2: the llm pool is autoscaled inside [MIN, MAX]; the Manager's
  # Static/Dynamic setting moves this range at runtime through the controller.
  LLM_POOL_MIN: ${LLM_POOL_MIN:-2}
  LLM_POOL_MAX: ${LLM_POOL_MAX:-8}
  RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
  RB_PDF_BACKEND: ${RB_PDF_BACKEND:-unoserver}
  AUTO_CREATE_SCHEMA: "false"
  TZ: ${CONTAINER_TZ:-UTC}

x-backend-base: &backend-base
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - storage:/storage

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    mem_limit: 128m
    cpu_shares: 512
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    <<: *backend-base
    environment:
      <<: *backend-env
    command: ["sh", "-c", "python manage.py migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"]
    mem_limit: 512m
    cpu_shares: 1024
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker-llm:
    <<: *backend-base
    environment:
      <<: *backend-env
    # prefork, never gevent: every task drives its own asyncio event loop
    # (app.workers.runtime), and gevent's monkey-patched selectors make those
    # loops hang, so the worker acks the message without ever running it.
    # --autoscale (not -c): children are created on demand, so an idle box keeps
    # only MIN alive and the controller can widen or narrow the range at runtime
    # with `app.control.autoscale()`. billiard only ever shrinks idle children.
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "llm", "-P", "prefork", "--autoscale", "${LLM_POOL_MAX:-8},${LLM_POOL_MIN:-2}", "--prefetch-multiplier", "1", "-l", "INFO", "-n", "llm@%h"]
    # ~270 MB per autoscaled child (measured): a container that hits this limit
    # gets its children OOM-killed, which costs the in-flight provider calls.
    # Sized for the Settings -> Processors maximum of 10, so the memory-driven
    # controller - not the cgroup - is what stops the growth.
    mem_limit: 3072m
    cpu_shares: 512
    stop_grace_period: 620s

  worker-render:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.render
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      RB_PDF_BACKEND: ${RB_PDF_BACKEND:-unoserver}
      UNOSERVER_MAX_CONVERSIONS: "200"
      UNOSERVER_MAX_RSS_MB: "700"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/storage
    # HW-1: lowest CPU share plus nice -n 10 inside the entrypoint.
    # Two children (RENDER_CONCURRENCY) smooth the burst when several LLM calls
    # land at once: one conversion is ~0.7 s of a single core and ~215 MB, and a
    # solo child is idle almost always. Raise it only with the free cores to match.
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "render", "-c", "${RENDER_CONCURRENCY:-2}", "-P", "prefork", "--prefetch-multiplier", "1", "-l", "INFO", "-n", "render@%h"]
    mem_limit: 1536m
    cpu_shares: 256
    stop_grace_period: 200s

  worker-ops:
    <<: *backend-base
    environment:
      <<: *backend-env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "ops", "-c", "1", "-B", "-l", "INFO", "-n", "ops@%h"]
    mem_limit: 256m
    cpu_shares: 512
    stop_grace_period: 60s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: remote_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: remote_flow
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    mem_limit: 1500m
    cpu_shares: 1024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remote_flow -d remote_flow"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redisdata:/data
    mem_limit: 256m
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
